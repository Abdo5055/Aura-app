.rowb{display:flex;justify-content:space-between;align-items:center;gap:8px}

a.btn{display:flex;align-items:center;justify-content:center;text-decoration:none}

.app{border-top:1px dashed #E2E8F0;padding-top:8px;display:flex;flex-direction:column;gap:6px}

.seg{display:flex;gap:4px;background:#E2E8F0;border-radius:14px;padding:4px;margin-bottom:10px}

.chk{display:flex;align-items:center;gap:10px;height:44px;background:#F8FAFC;border-radius:12px;padding:0 12px;font-weight:700;font-size:14px}

.kv{display:flex;flex-direction:column;gap:2px;padding:6px 0;border-bottom:1px solid #F1F5F9}

.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{background:var(--teal);color:#fff;padding:6px 4px;white-space:nowrap}

.mini{display:flex;gap:8px;margin-top:10px}.mini div{flex:1;background:rgba(255,255,255,.14);border-radius:12px;padding:8px;font-size:11px}.mini b{display:block;font-size:15px;color:#fff}

.tile b{display:block;font-size:24px;font-weight:800}
.al{border-radius:14px;padding:10px 12px;font-size:13px;font-weight:700}
.al.y{background:#FEF3C7;color:#92400E}.al.r{background:#FEE2E2;color:#991B1B}.al.g{background:#D1FAE5;color:#065F46}
#printArea{display:none}
@media print{body>*:not(#printArea){display:none!important}#printArea{display:block!important;padding:8px;direction:rtl}@page{size:A4 landscape;margin:10mm}}

.gcard{background:#fff;border-radius:22px;padding:14px;box-shadow:0 1px 3px rgba(15,23,42,.08);display:flex;flex-direction:column;gap:8px;border:2px solid transparent;transition:transform .15s,box-shadow .2s;cursor:pointer}
.gcard:active{transform:scale(.98)}
.gcard.ach{border-color:#F59E0B;background:linear-gradient(135deg,#FFFBEB,#fff);box-shadow:0 4px 14px rgba(245,158,11,.25)}
.gnum{font-size:30px;font-weight:800;line-height:1}.gnum small{font-size:15px;color:var(--muted);font-weight:700}
.gpct{font-weight:800;font-size:16px;color:var(--teal);display:flex;align-items:center;gap:6px}
.gstar{font-size:22px;color:#CBD5E1;transition:color .3s,transform .3s}
.gstar.on{color:#F59E0B;animation:gpop .7s ease both}
.gbar{position:relative;height:18px;border-radius:99px;background:#E2E8F0;overflow:hidden}
.gbar.mini{height:10px}
.gfill{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#0F766E,#10B981 60%,#F59E0B);transition:width 1.1s cubic-bezier(.2,.8,.2,1);position:relative;overflow:hidden}
.gfill::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);transform:translateX(120%);animation:gshine 2.6s ease-in-out infinite}
.gtick{position:absolute;top:0;bottom:0;width:2px;background:rgba(15,23,42,.18)}
.gtick.on{background:rgba(255,255,255,.7)}
.gmsg{font-size:13px;font-weight:600}
@keyframes gshine{to{transform:translateX(-120%)}}
@keyframes gpop{0%{transform:scale(.3) rotate(-30deg)}60%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.gfill,.gstar,.gcard{transition:none!important;animation:none!important}.gfill::after{animation:none!important}}

</style>

async function login(){
  showErr('');
  let u = $('u').value.trim().toLowerCase(); const p = $('p').value;
  if(!u || !p){ showErr('اكتب اسم المستخدم وكلمة المرور'); return; }
  if(!u.includes('@')) u += '@aura.local';
  $('go').disabled = true; $('go').textContent = 'جاري الدخول...';
  const { error } = await sb.auth.signInWithPassword({ email: u, password: p });
  $('go').disabled = false; $('go').textContent = 'دخول';
  if(error){ showErr('اسم المستخدم أو كلمة المرور غير صحيحة'); return; }
  await start();
}

// ---- بعد الدخول: قراءة الدور من قاعدة البيانات فقط ----
async function start(){
  const { data: { user } } = await sb.auth.getUser();
  if(!user){ showLogin(); return; }
  const { data, error } = await sb.from('profiles').select('full_name, role, is_tl, active, manager_id').eq('id', user.id).maybeSingle();
  if(error || !data || !data.active){
    await sb.auth.signOut(); showLogin();
    showErr('الحساب غير مفعّل، تواصل مع المدير'); return;
  }
  profile = data; uid = user.id; showApp(); resetIdle();
}

// ================= المرحلة 2: المرشحين وتغيير الحالة =================
function h(tag, attrs, ...kids){
  const e=document.createElement(tag); let val;
  for(const k in (attrs||{})){ const v=attrs[k];
    if(k==='class') e.className=v;
    else if(k==='style') e.style.cssText=v;
    else if(k==='value') val=v;
    else if(k.startsWith('on')) e[k]=v;
    else if(v!==false && v!=null) e.setAttribute(k, v===true?'':v);
  }
  kids.flat(2).forEach(c=>{ if(c==null||c===false) return; e.appendChild(typeof c==='object'?c:document.createTextNode(String(c))); });
  if(val!==undefined) e.value=val;
  return e;
}

async function copy(text){
  try{ await navigator.clipboard.writeText(text); }
  catch(e){ const t=h('textarea',{style:'position:fixed;opacity:0'}); t.value=text; document.body.appendChild(t); t.select(); try{document.execCommand('copy');}catch(_){} t.remove(); }
  toast('تم النسخ ✓');
}
const today=()=>{ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const localInput=iso=>{ const d=new Date(iso), p=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes()); };
const safeUrl=u=>{ try{ const x=new URL(String(u||'').trim()); return (x.protocol==='https:'||x.protocol==='http:')?x.href:''; }catch(e){ return ''; } };
function normPhone(p){
  let d=(p||'').replace(/\D/g,'');
  if(d.startsWith('0020')) d=d.slice(4);
  if(d.startsWith('20') && d.length===12) d='0'+d.slice(2);
  if(d.length===10 && d.startsWith('1')) d='0'+d;
  return d;
}
const waNum=p=> p.startsWith('0') ? '2'+p : p;

const ST={
  offered:['عُرض عليه الأوفر','g'], accepted_offer:['وافق على الأوفر','bl'], declined_offer:['رفض الأوفر','rd'],
  voice_sent:['فويس نوت - بانتظار المدير','bl'], voice_accepted:['الفويس مقبول - حدد معاد الإنترفيو','gr'], voice_rejected:['الفويس مرفوض','rd'],
  interview_pending:['الإنترفيو - بانتظار المدير','or'], interview_set:['الإنترفيو مؤكد','or'], no_show:['لم يحضر','rd'], interviewed:['تم الإنترفيو - بانتظار النتيجة','or'],
  rejected_after_interview:['مرفوض بعد الإنترفيو','rd'], hired:['تم التعيين','gr'], retention_failed:['ترك الشغل - العمولة ضاعت','rd'],
  commission_received:['تم استلام العمولة','dg']
};
// خطوات الريكروتر (للأمام + سحب الطلب)
const NEXT={
  offered:['voice_sent','declined_offer'], accepted_offer:['voice_sent','declined_offer','offered'],
  voice_sent:['offered'], voice_accepted:['interview_pending'], interview_pending:['voice_accepted'],
  interview_set:['interviewed','no_show'], no_show:['interview_pending'],
  interviewed:['hired','rejected_after_interview'], hired:['retention_failed','commission_received']
};
// خطوات القرار: بتظهر للمدير بس (الموافقة على الفويس نوت / الموافقة على الإنترفيو)
const APPROVAL={ voice_sent:['voice_accepted','voice_rejected'], interview_pending:['interview_set'] };
const APPROVE_ROLES=['owner'];
const canApprove=()=>APPROVE_ROLES.includes(profile.role);
const TERMINAL=['declined_offer','voice_rejected','rejected_after_interview','retention_failed','commission_received'];
const NEEDS_REASON=['declined_offer','voice_rejected','no_show','rejected_after_interview','retention_failed'];
function allowed(st){
  const base=(NEXT[st]||[]).filter(s=>{
    if((s==='hired'||s==='retention_failed') && !['owner','senior'].includes(profile.role)) return false;
    if(s==='commission_received' && profile.role!=='owner') return false;
    return true;
  });
  const appr=canApprove()?(APPROVAL[st]||[]):[];
  return appr.concat(base.filter(s=>!appr.includes(s)));
}

let CANDS=[], FILTER={q:'',status:'',type:'',archived:false};
async function loadCands(){
  const { data, error } = await sb.from('candidates')
    .select('*, applications(id,status,voice_status,archived,offer_id,interview_at,offers(title,candidate_message,interview_info,companies(name)))')
    .order('created_at',{ascending:false});
  if(error){ toast('تعذر تحميل المرشحين'); return []; }
  if(profile.role!=='recruiter'){ const pn=await sb.from('profiles').select('id,full_name'); (pn.data||[]).forEach(p=>NAMES[p.id]=p.full_name); }
  return data||[];
}

async function renderCands(){
  sub=null;
  const page=$('page'); page.innerHTML='';
  page.appendChild(h('h2',null,'المرشحين'));
  const q=h('input',{class:'in',placeholder:'بحث بالاسم أو الرقم',value:FILTER.q,oninput:e=>{FILTER.q=e.target.value;paint();}});
  const sel=h('select',{class:'in',onchange:e=>{FILTER.status=e.target.value;paint();}},
    h('option',{value:''},'كل الحالات'), Object.keys(ST).filter(k=>k!=='accepted_offer').map(k=>h('option',{value:k},ST[k][0])));
  sel.value=FILTER.status;
    const arch=h('button',{class:'ch'+(FILTER.archived?' on':''),onclick:()=>{FILTER.archived=!FILTER.archived;renderCands();}},'الأرشيف');
  const count=h('div',{class:'m'});
  const list=h('div',{class:'list'});
  page.append(q, h('div',{class:'r2',style:'margin-top:8px'},sel,arch), h('button',{class:'btn amber sm',style:'margin-top:8px;width:100%;flex:none',onclick:renderInterviews},'مواعيد الإنترفيو'), isOwner()?h('button',{class:'btn b2 sm',style:'margin-top:8px;width:100%;flex:none',onclick:exportCandsCSV},'تصدير المرشحين (CSV)'):null, count, list);
  list.appendChild(h('div',{class:'m'},'جاري التحميل...'));
  CANDS=await loadCands(); paint();

  function paint(){
    list.innerHTML='';
    const qq=FILTER.q.trim().toLowerCase(), qd=qq.replace(/\D/g,'');
    const rows=CANDS.filter(c=>{
      const apps=c.applications||[];
      const isArch=c.archived || (apps.length>0 && apps.every(a=>a.archived));
      if(isArch!==FILTER.archived) return false;
      if(FILTER.status && !apps.some(a=>a.status===FILTER.status)) return false;
      if(qq && !(c.full_name.toLowerCase().includes(qq) || (qd && c.phone.includes(qd)))) return false;
      return true;
    });
    count.textContent=rows.length+' مرشح';
    if(!rows.length){ list.appendChild(h('div',{class:'empty'},'مفيش مرشحين هنا.')); return; }
    rows.forEach(c=>list.appendChild(candCard(c)));
  }
}

function appRow(a,c){
  const o=a.offers||{}, co=(o.companies&&o.companies.name)||'', st=ST[a.status]||[a.status,'g'];
  const kids=[h('div',{class:'rowb'},h('b',{style:'font-size:14px'},co+(o.title?' - '+o.title:'')),h('span',{class:'t '+st[1]},st[0]))];

// ---- تغيير الحالة (قائمة ثم تأكيد) ----
function statusSheet(a,c){
  const appr=canApprove(), opts=allowed(a.status), wait=APPROVAL[a.status];
  const list=h('div',{class:'opts'});
  if(wait){
    list.appendChild(h('div',{class:'al y'},appr?'الخطوة دي بانتظار قرارك.':'الخطوة دي بانتظار موافقة المدير. تقدر تسحب الطلب لو عايز تعدّل.'));
    if(appr&&a.status==='voice_sent'&&safeUrl(c.voice_url)) list.appendChild(h('a',{class:'btn amber',href:safeUrl(c.voice_url),target:'_blank',rel:'noopener'},'سماع الفويس نوت'));
    if(appr&&a.status==='interview_pending'&&a.interview_at) list.appendChild(h('div',{class:'m'},'الموعد المطلوب: '+new Date(a.interview_at).toLocaleString('ar-EG',{dateStyle:'medium',timeStyle:'short'})));
  }
  if(!opts.length) list.appendChild(h('div',{class:'m'},'مفيش حالات متاحة بعد الحالة دي لصلاحيتك.'));
  opts.forEach(s=>list.appendChild(optBtn(a,c,s)));
  if(appr){
    const rest=Object.keys(ST).filter(s=>s!==a.status&&!opts.includes(s)&&s!=='accepted_offer');
    const more=h('div',{class:'opts',style:'display:none'},rest.map(s=>optBtn(a,c,s)));
    const tg=h('button',{class:'btn b2',onclick:()=>{ const o=more.style.display==='none'; more.style.display=o?'flex':'none'; tg.textContent=o?'إخفاء التعديل اليدوي':'تعديل يدوي: الانتقال لأي حالة ▾'; }},'تعديل يدوي: الانتقال لأي حالة ▾');
    list.append(tg,more);
  }
  openSheet('تغيير حالة '+c.full_name,list);
}
const optBtn=(a,c,s)=>h('button',{class:'opt',onclick:()=>changeStatus(a,c,s)},h('span',{class:'dot '+ST[s][1]}),ST[s][0]);
async function changeStatus(a,c,to){
  const extra=h('div',{style:'display:flex;flex-direction:column;gap:6px'});
  let dt,dd,rs;
  if(to==='interview_pending'||to==='interview_set'){ dt=h('input',{type:'datetime-local',class:'in',value:a.interview_at?localInput(a.interview_at):''}); extra.append(h('label',{class:'lb'},'معاد الإنترفيو'),dt); }
  if(to==='hired'){ dd=h('input',{type:'date',class:'in',value:today()}); extra.append(h('label',{class:'lb'},'تاريخ بداية الشغل'),dd); }
  if(NEEDS_REASON.includes(to)){ rs=h('textarea',{class:'in',rows:2,placeholder:'السبب (اختياري)'}); extra.append(rs); }

  if(rs && rs.value.trim()) upd.reject_reason=rs.value.trim();
  const { error } = await sb.from('applications').update(upd).eq('id',a.id);

  closeSheet(); toast('تم تغيير الحالة'); if(sub===renderCands) renderInterviews(); else renderCands();

// ---- مطابقة وعرض أوفر ----
function matches(c,o,skipLang){
  if(o.min_age!=null && c.age!=null && c.age<o.min_age) return false;
  if(o.max_age!=null && c.age!=null && c.age>o.max_age) return false;
  if(o.grad_allowed && o.grad_allowed.length && c.grad_status && !o.grad_allowed.includes(c.grad_status)) return false;
  if(!skipLang){
    const eq=(a,b)=>a&&b&&a.trim().toLowerCase()===b.trim().toLowerCase();
    const okL=(ol,r)=>{ if(!ol||r==null) return true; r=nr(r); return (eq(c.lang1,ol)&&(nr(c.lang1_rank)||0)>=r)||(eq(c.lang2,ol)&&(nr(c.lang2_rank)||0)>=r); };
    if(!okL(o.lang1,o.lang1_min_rank)||!okL(o.lang2,o.lang2_min_rank)) return false;
  }
  if(c.experience_months!=null&&c.experience_months<(o.min_experience_months||0)) return false;
  if(o.gender && c.gender && o.gender!==c.gender) return false;
  return true;
}

 ['Sheikh Zayed',['sheikh zayed','الشيخ زايد']],['6th of October',['6th of october','6th october','6 أكتوبر','أكتوبر','اكتوبر']],
 ['Abu Rawash',['abu rawash','أبو رواش','ابو رواش']],['Dokki',['dokki','الدقي']],['El Nozha',['nozha','النزهة']],['Sheraton',['sheraton','شيراتون']],
 ['Abbasiya',['abbasiya','abbassia','العباسية']],['Downtown',['downtown','وسط البلد','tahrir']],['Suez Road',['suez road','طريق السويس']],
 ['Smart Village',['smart village']],['Alexandria',['alexandria','الإسكندرية']],['Hurghada',['hurghada','الغردقة']],['Remote (WFH)',['remote','wfh']]];
function offerAreas(o){
  const t=(o.location||'').toLowerCase(); const hit=[];
  AREAS.forEach(([lab,keys])=>{ if(keys.some(k=>t.includes(k))) hit.push(lab); });
  if(hit.includes('Zahraa El Maadi')&&hit.includes('Maadi')&&!t.replace(/zahraa el maadi/g,'').includes('maadi')) hit.splice(hit.indexOf('Maadi'),1);
  if(!hit.length&&t) hit.push((o.location||'').split(/[,\-(]/)[0].trim());
  return hit;
}
const nl=x=>(x||'').trim().toLowerCase();
function langMatchSearch(o,chosen,lv){
  if(!chosen.length) return true;
  const ol=[...new Set([o.lang1,o.lang2].map(nl).filter(Boolean))];
  if(ol.length!==chosen.length||!ol.every(l=>chosen.includes(l))) return false;
  const need={}; need[nl(o.lang1)]=nr(o.lang1_min_rank); if(o.lang2) need[nl(o.lang2)]=nr(o.lang2_min_rank);
  return ol.every(l=>{ const have=lv[l], r=need[l]; return have==null||r==null||have>=r; });
}

const fmt=n=>Number(n||0).toLocaleString('en-US');
const daysTo=d=>Math.round((new Date(d+'T00:00:00')-new Date(today()+'T00:00:00'))/86400000);
const KIND={recruiter:'ريكروتر',senior:'سينيور',tl:'تيم ليدر'};
const CS={expected:['متوقعة','or'],ready:['جاهزة','gr'],paid:['مدفوعة','dg'],lost:['ضايعة','rd']};
function cstate(c){
  if(c.status==='paid') return 'paid'; if(c.status==='lost') return 'lost';
  return (c.expected_date && c.expected_date<=today()) ? 'ready' : 'expected';
}
function cycleLabel(d){
  if(!d) return '';
  const x=new Date(d+'T00:00:00'), day=x.getDate(); let m=x.getMonth(), y=x.getFullYear(), lab;
  if(day<=3) lab='1-3'; else if(day<=17) lab='15-17'; else { lab='1-3'; m++; if(m>11){m=0;y++;} }
  return 'دورة '+lab+' '+new Date(y,m,1).toLocaleDateString('ar-EG',{month:'long'});
}
async function loadMoney(){
  const r=await sb.from('commissions').select('*, earner:profiles!earner_id(full_name), applications(id,status,retention_end,candidates(full_name),offers(id,title,companies(name)))').order('expected_date');
  const priv={};
  if(isOwner()){ const p=await sb.from('commission_private').select('*'); (p.data||[]).forEach(x=>priv[x.application_id]=x); }
  return { rows:r.data||[], priv, error:r.error };
}
function sums(rows){ const o={expected:0,ready:0,paid:0,lost:0}; rows.forEach(c=>{o[cstate(c)]+=Number(c.amount||0);}); return o; }
function ownerNet(rows,priv){
  const by={}; rows.forEach(c=>{ (by[c.application_id]=by[c.application_id]||[]).push(c); });
  let agency=0,team=0,net=0,netReady=0;
  Object.keys(by).forEach(id=>{ const rs=by[id]; if(rs.every(c=>c.status==='lost')) return; const p=priv[id]; if(!p) return;
    agency+=Number(p.agency_amount); net+=Number(p.net_amount); team+=Number(p.agency_amount)-Number(p.net_amount);
    if(rs.some(c=>cstate(c)==='ready')) netReady+=Number(p.net_amount); });
  return {agency,team,net,netReady};
}

// ================= الأهداف الشهرية =================
const MONTHS_AR=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
let GOAL_CELEBRATED=false;
const monthLabel=mk=>{ const [y,m]=mk.split('-').map(Number); return MONTHS_AR[m-1]+' '+y; };
const hiresOf=(apps,mk,ids)=>apps.filter(a=>['hired','commission_received'].includes(a.status)&&a.hired_at&&a.hired_at.slice(0,7)===mk&&ids.has(a.owner_id)).length;
function goalCalc(g,apps,profs,mk){
  const mem=profs.filter(p=>p.manager_id===g.user_id&&p.active);
  const ids=new Set(g.scope==='team'?mem.map(m=>m.id):[g.user_id]);
  const done=hiresOf(apps,mk,ids), target=g.target_hires;
  return {done,target,left:Math.max(0,target-done),pct:Math.min(100,Math.round(done*100/target)),ach:done>=target,mem};
}
const daysLeftInMonth=()=>{ const n=new Date(); return new Date(n.getFullYear(),n.getMonth()+1,0).getDate()-n.getDate()+1; };
function goalMsg(c,g){
  const dl=daysLeftInMonth(), bon=Number(g.bonus_amount||0);
  if(c.ach) return bon?('ممتاز! الهدف اتحقق وبونص '+fmt(bon)+' ج.م مستحق.'):'ممتاز! الهدف اتحقق.';
  if(c.done===0) return 'ابدأ بأول توظيف. قدامك '+dl+' يوم.';
  if(c.pct>=75) return 'قربت! فاضل '+c.left+' توظيف بس.';
  const pace=Math.max(1,Math.ceil(dl/c.left));
  return 'فاضل '+c.left+' توظيف و'+dl+' يوم'+(c.left>dl?' - لازم توظيف كل يوم تقريبًا.':' - يعني توظيف كل '+pace+' يوم تقريبًا.');
}
function goalBar(c,mini){
  const fill=h('div',{class:'gfill'});
  const bar=h('div',{class:'gbar'+(mini?' mini':'')},fill,[25,50,75].map(p=>h('i',{class:'gtick'+(c.pct>=p?' on':''),style:'right:'+p+'%'})));
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ fill.style.width=c.pct+'%'; }));
  return bar;
}
function goalBonusChip(g,c){
  const bon=Number(g.bonus_amount||0); if(!bon) return null;
  return h('span',{class:'t '+(g.bonus_paid?'dg':(c.ach?'or':'g'))},(g.bonus_paid?'بونص مدفوع ':'بونص ')+fmt(bon)+' ج.م');
}
function goalCard(g,c,label,onTap){
  return h('div',{class:'gcard'+(c.ach?' ach':''),onclick:onTap},
    h('div',{class:'rowb'},h('b',{style:'font-size:14px'},label),goalBonusChip(g,c)),
    h('div',{class:'rowb',style:'align-items:flex-end'},h('div',{class:'gnum'},c.done,h('small',null,' / '+c.target)),h('div',{class:'gpct'},c.pct+'%',h('span',{class:'gstar'+(c.ach?' on':'')},'★'))),
    goalBar(c), h('div',{class:'m gmsg'},goalMsg(c,g)));
}
function renderGoals(body,apps,profs,goals){
  const mk=today().slice(0,7), nm=id=>(profs.find(p=>p.id===id)||{}).full_name||'';
  body.appendChild(h('div',{class:'rowb'},h('b',{style:'font-size:15px'},'هدف '+monthLabel(mk)),isOwner()?h('button',{class:'lnk',onclick:()=>goalsManager()},'تحديد الأهداف'):null));
  const list=isOwner()?goals.slice().sort((a,b)=>nm(a.user_id).localeCompare(nm(b.user_id),'ar')||(a.scope==='team'?1:-1)):goals.filter(g=>g.user_id===uid).sort((a,b)=>a.scope==='personal'?-1:1);
  if(!list.length){ body.appendChild(h('div',{class:'empty'},isOwner()?'مفيش أهداف للشهر ده لسه. اضغط "تحديد الأهداف".':'لسه ما اتحددلكش هدف للشهر ده.')); return; }
  let dueTotal=0;
  list.forEach(g=>{ const c=goalCalc(g,apps,profs,mk);
    if(isOwner()&&c.ach&&!g.bonus_paid) dueTotal+=Number(g.bonus_amount||0);
    const label=isOwner()?(nm(g.user_id)+(g.scope==='team'?' - هدف الفريق':'')):(g.scope==='team'?'هدف فريقي':'هدفي الشخصي');
    body.appendChild(goalCard(g,c,label,()=>goalDetails(g,c,profs,apps,mk,goals,label)));
    if(!isOwner()&&c.ach&&!GOAL_CELEBRATED){ GOAL_CELEBRATED=true; setTimeout(()=>toast('مبروك! حققت '+label),600); }
  });
  if(isOwner()&&dueTotal>0) body.appendChild(h('div',{class:'al y'},'بونصات أهداف مستحقة للدفع: '+fmt(dueTotal)+' ج.م'));
}
function goalDetails(g,c,profs,apps,mk,goals,label){
  const bon=Number(g.bonus_amount||0), dl=daysLeftInMonth();
  const box=h('div',{style:'display:flex;flex-direction:column;gap:10px'},
    h('div',{class:'gcard'+(c.ach?' ach':''),style:'cursor:default'},
      h('div',{class:'rowb'},h('b',null,label+' - '+monthLabel(mk)),goalBonusChip(g,c)),
      h('div',{class:'rowb',style:'align-items:flex-end'},h('div',{class:'gnum'},c.done,h('small',null,' / '+c.target)),h('div',{class:'gpct'},c.pct+'%',h('span',{class:'gstar'+(c.ach?' on':'')},'★'))),
      goalBar(c)),
    h('div',{class:'al '+(c.ach?'g':'y')},goalMsg(c,g)),
    kv('المتبقي',c.left+' توظيف'), kv('الأيام المتبقية في الشهر',dl),
    kv('البونص',bon?(fmt(bon)+' ج.م - '+(g.bonus_paid?'تم الدفع':(c.ach?'مستحق':'يتحقق عند اكتمال الهدف'))):'لا يوجد'));
  if(g.scope==='team'&&c.mem.length){
    box.appendChild(h('b',{style:'font-size:14px;margin-top:6px'},'مساهمة الفريق'));
    c.mem.forEach(m=>{ const mg=goals.find(x=>x.user_id===m.id&&x.scope==='personal'), n=hiresOf(apps,mk,new Set([m.id]));
      const mc=mg?goalCalc(mg,apps,profs,mk):null;
      box.appendChild(h('div',{class:'app'},h('div',{class:'rowb'},h('b',{style:'font-size:14px'},m.full_name),h('span',{class:'t '+(mc&&mc.ach?'gr':'g')},n+(mg?' / '+mg.target_hires:' توظيف'))),mc?goalBar(mc,true):null));
    });
  }
  if(isOwner()){
    const r=h('div',{class:'r2'});
    if(c.ach&&bon&&!g.bonus_paid) r.appendChild(h('button',{class:'btn amber sm',onclick:async()=>{
      if(!await confirmBox('تأكيد دفع البونص؟','تأكيد دفع بونص '+fmt(bon)+' ج.م ('+label+').',null,'تأكيد الدفع')) return;
      const {error}=await sb.from('goals').update({bonus_paid:true,bonus_paid_at:today()}).eq('id',g.id);
      if(error){ toast(error.message); return; } closeSheet(); toast('تم تسجيل دفع البونص ✓'); renderToday();
    }},'تم دفع البونص'));
    r.appendChild(h('button',{class:'btn b2 sm',onclick:()=>goalsManager(mk)},'تعديل الأهداف'));
    box.appendChild(r);
  }
  openSheet('تفاصيل الهدف',box);
}
async function goalsManager(mk){
  if(!isOwner()) return;
  mk=mk||today().slice(0,7); const month=mk+'-01';
  openSheet('تحديد الأهداف',h('div',{class:'m'},'جاري التحميل...'));
  const [pr,gs]=await Promise.all([sb.from('profiles').select('id,full_name,role,is_tl').eq('active',true).neq('role','owner').order('full_name'),sb.from('goals').select('*').eq('month',month)]);
  if(pr.error||gs.error){ openSheet('تحديد الأهداف',h('div',{class:'err'},'تعذر التحميل. اتأكد إن جدول الأهداف (goals) اتعمل في Supabase.')); return; }
  const mi=h('input',{type:'month',class:'in',value:mk,onchange:e=>{ if(e.target.value) goalsManager(e.target.value); }});
  const rows=[]; const box=h('div',{style:'display:flex;flex-direction:column;gap:10px'},fld('الشهر',mi));
  const mkRow=(p,scope,title)=>{
    const ex=(gs.data||[]).find(g=>g.user_id===p.id&&g.scope===scope);
    const t=h('input',{class:'in',type:'number',inputmode:'numeric',placeholder:'عدد التوظيفات',value:ex?ex.target_hires:''});
    const b=h('input',{class:'in',type:'number',inputmode:'decimal',placeholder:'بونص (جنيه)',value:ex?ex.bonus_amount:''});
    rows.push({user_id:p.id,scope,t,b,ex});
    return h('div',{class:'card',style:'gap:6px'},h('div',{class:'rowb'},h('b',{style:'font-size:14px'},title),h('span',{class:'t g'},ROLE[p.role]||p.role)),h('div',{class:'r2'},fld('الهدف',t),fld('البونص',b)));
  };
  (pr.data||[]).forEach(p=>{ box.appendChild(mkRow(p,'personal',p.full_name+' - هدف شخصي')); if(p.role==='senior'&&p.is_tl) box.appendChild(mkRow(p,'team',p.full_name+' - هدف الفريق')); });
  if(!(pr.data||[]).length) box.appendChild(h('div',{class:'empty'},'مفيش مستخدمين لسه.'));
  const err=errBox();
  const prev=new Date(mk+'-01T00:00:00'); prev.setMonth(prev.getMonth()-1);
  const pmk=prev.getFullYear()+'-'+String(prev.getMonth()+1).padStart(2,'0');
  box.appendChild(h('button',{class:'btn b2',onclick:async()=>{
    const {data}=await sb.from('goals').select('*').eq('month',pmk+'-01');
    (data||[]).forEach(g=>{ const r=rows.find(x=>x.user_id===g.user_id&&x.scope===g.scope); if(r){ r.t.value=g.target_hires; r.b.value=g.bonus_amount; } });
    toast('تم نسخ أهداف الشهر اللي فات - اضغط حفظ');
  }},'نسخ أهداف الشهر اللي فات'));
  box.appendChild(err);
  box.appendChild(h('div',{class:'r2'},h('button',{class:'btn b2',style:'flex:1',onclick:closeSheet},'إلغاء'),
    h('button',{class:'btn',style:'flex:1.6',onclick:async()=>{
      const up=[],del=[];
      rows.forEach(r=>{ const t=toInt(r.t.value), b=toNum(r.b.value)||0;
        if(t>0) up.push({user_id:r.user_id,scope:r.scope,month,target_hires:t,bonus_amount:b}); else if(r.ex) del.push(r.ex.id); });
      if(up.length){ const x=await sb.from('goals').upsert(up,{onConflict:'user_id,scope,month'}); if(x.error){ showErr2(err,x.error.message); return; } }
      if(del.length){ const x=await sb.from('goals').delete().in('id',del); if(x.error){ showErr2(err,x.error.message); return; } }
      closeSheet(); toast('تم حفظ الأهداف ✓'); renderToday();
    }},'حفظ')));
  openSheet('تحديد أهداف '+monthLabel(mk),box);
}

// ================= تصدير CSV (المدير) =================
function downloadCSV(name,headers,rows){
  const esc=v=>{ v=v==null?'':String(v); if(/^[=+\-@]/.test(v)) v="'"+v; return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; };
  const csv='\ufeff'+[headers].concat(rows).map(r=>r.map(esc).join(',')).join('\r\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),3000);
}

  lastBack=n; toast('اضغط رجوع مرة تانية للخروج'); keep();
});

(function(){
  var urls=['https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js','https://unpkg.com/@supabase/supabase-js@2.45.4/dist/umd/supabase.js'];
  var btn=document.getElementById('go'), er=document.getElementById('err');
  btn.disabled=true; btn.textContent='جاري التحميل...';
  function next(i){
    if(i>=urls.length){ er.textContent='تعذر تحميل مكتبة الاتصال. جرّب شبكة أو متصفح تاني.'; er.style.display='block'; btn.textContent='دخول'; return; }
    var sc=document.createElement('script'); sc.src=urls[i]; var done=false;
    var t=setTimeout(function(){ if(!done){ done=true; sc.remove(); next(i+1); } },8000);
    sc.onload=function(){ if(done) return; done=true; clearTimeout(t); btn.disabled=false; btn.textContent='دخول'; boot(); };
    sc.onerror=function(){ if(done) return; done=true; clearTimeout(t); next(i+1); };
    document.head.appendChild(sc);
  }
  next(0);
})();
