<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Jost:wght@300;500&display=swap" media="print" onload="this.media='all'">
<style>
:root{--dark:#033C38;--teal:#0F766E;--amber:#F59E0B;--bg:#F3F5F9;--ink:#0F172A;--muted:#64748B;--cream:#F5F1E8;--gold:#E2C48F}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;font-family:Cairo,sans-serif;background:var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer}
.btn{border:0;font-weight:700;font-size:15px;border-radius:16px;padding:0 18px;height:48px;background:var(--teal);color:#fff;box-shadow:0 4px 0 #0A4F4A}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #0A4F4A}
.btn:disabled{opacity:.6}
.btn.amber{background:var(--amber);color:#1c1300;box-shadow:0 4px 0 #B45309}
.btn.amber:active{box-shadow:0 1px 0 #B45309}
/* login */
#login{min-height:100%;background:var(--dark);display:flex;flex-direction:column;justify-content:center;gap:30px;padding:28px calc(28px + env(safe-area-inset-right)) 28px calc(28px + env(safe-area-inset-left))}
.logo{display:flex;flex-direction:column;align-items:center;gap:14px;direction:ltr;text-align:center}
.logo .n{font-family:Jost,sans-serif;font-weight:300;font-size:64px;letter-spacing:18px;padding-left:18px;color:var(--cream);line-height:1}
.logo .l{width:56px;height:2px;background:var(--gold)}
.logo .s{font-family:Jost,sans-serif;font-weight:500;font-size:11px;letter-spacing:3px;color:var(--gold)}
.logo .t{font-family:Jost,sans-serif;font-size:10px;letter-spacing:4px;color:#CFE8E4}
.form{display:flex;flex-direction:column;gap:14px;max-width:420px;width:100%;margin:0 auto}
.form h1{margin:0;font-size:20px;font-weight:800;color:var(--cream)}
.form .sub{font-size:12px;color:#CFE8E4}
.form label{display:block;font-weight:700;font-size:13px;color:#E6F4F1;margin-bottom:6px}
.field{position:relative}
.field input{width:100%;height:50px;border:0;border-radius:14px;padding:0 14px;font:inherit;font-size:15px;background:#fff;direction:ltr;text-align:right}
.field .eye{position:absolute;left:8px;top:7px;height:36px;border:0;background:none;color:var(--teal);font-weight:700;font-size:13px}
.err{background:#FEE2E2;color:#991B1B;border-radius:12px;padding:10px 12px;font-size:13px;font-weight:700}
/* shell */
#app{display:none;flex-direction:column;height:100%}
header{background:var(--dark);color:var(--cream);padding:calc(12px + env(safe-area-inset-top)) 18px 14px;border-radius:0 0 24px 24px;display:flex;align-items:center;justify-content:space-between;gap:10px}
header .who b{font-size:18px;font-weight:800;display:block}
.badge{display:inline-block;font-size:12px;font-weight:700;border-radius:99px;padding:2px 10px;background:var(--gold);color:#3b2a05;margin-top:3px;margin-inline-end:4px}
header .side{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
header .mark{font-family:Jost,sans-serif;font-weight:300;letter-spacing:5px;font-size:16px;border-bottom:2px solid var(--gold);padding-bottom:2px;direction:ltr}
header .out{background:none;border:1.5px solid rgba(255,255,255,.35);color:var(--cream);border-radius:10px;font-size:12px;font-weight:700;padding:4px 10px}
main{flex:1;overflow:auto;padding:18px}
main h2{margin:0 0 6px;font-size:22px;font-weight:800}
.empty{background:#fff;border-radius:20px;padding:22px;color:var(--muted);box-shadow:0 1px 3px rgba(15,23,42,.08)}
nav{position:relative;height:calc(68px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:#fff;border-top:1px solid #E2E8F0;display:flex;justify-content:space-around;align-items:center}
nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--muted);min-width:60px}
nav button.on{color:var(--teal)}
nav svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.gap{width:56px}
.fab{position:absolute;left:calc(50% - 28px);bottom:calc(46px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:20px;border:0;background:var(--amber);color:#1c1300;font-size:32px;font-weight:700;box-shadow:0 4px 0 #B45309;z-index:5}
#menu{display:none;position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:9}
#menu .items{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(118px + env(safe-area-inset-bottom));width:min(300px,80%);display:flex;flex-direction:column;gap:10px}
#menu .it{height:48px;background:#fff;border:0;border-radius:16px;font-weight:700;font-size:15px;box-shadow:0 4px 0 #CBD5E1;text-align:right;padding:0 16px;display:flex;justify-content:space-between;align-items:center}
.tag{font-size:11px;background:#E2E8F0;color:#334155;border-radius:99px;padding:2px 8px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:110px;background:var(--ink);color:#fff;border-radius:12px;padding:10px 16px;font-size:13px;font-weight:700;display:none;z-index:20}

.in{width:100%;height:46px;border:1.5px solid #CBD5E1;border-radius:12px;padding:0 12px;font:inherit;font-size:14px;background:#fff;color:var(--ink)}
textarea.in{height:auto;padding:10px 12px}
select.in{padding:0 8px}
.card{background:#fff;border-radius:20px;padding:14px;box-shadow:0 1px 3px rgba(15,23,42,.08);display:flex;flex-direction:column;gap:8px}
.list{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.rowb{display:flex;justify-content:space-between;align-items:center;gap:8px}
.r2{display:flex;gap:8px;align-items:flex-end}
.f{display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}
.lb{font-size:12px;font-weight:700;color:#334155}
.m{color:var(--muted);font-size:12px}
.lnk{background:none;border:0;color:var(--teal);font-weight:700;font-size:13px}
.ch{border:1.5px solid #CBD5E1;background:#fff;border-radius:12px;padding:0 14px;height:46px;font-weight:700;font-size:13px;color:#334155;white-space:nowrap}
.ch.on{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.sm{height:38px;font-size:13px;flex:1;box-shadow:0 3px 0 #0A4F4A;padding:0 10px}
.btn.b2{background:#fff;color:var(--teal);box-shadow:0 3px 0 #CBD5E1;border:1.5px solid #CBD5E1}
.btn.amber.sm{box-shadow:0 3px 0 #B45309}
.btn.dng{background:#fff;color:#991B1B;border:1.5px solid #FECACA;box-shadow:0 3px 0 #FECACA}
a.btn{display:flex;align-items:center;justify-content:center;text-decoration:none}
.t{font-size:12px;font-weight:700;border-radius:99px;padding:2px 10px;white-space:nowrap}
.t.g{background:#E2E8F0;color:#334155}.t.bl{background:#DBEAFE;color:#1E40AF}.t.gr{background:#D1FAE5;color:#065F46}.t.or{background:#FEF3C7;color:#92400E}.t.rd{background:#FEE2E2;color:#991B1B}.t.dg{background:#065F46;color:#fff}
.app{border-top:1px dashed #E2E8F0;padding-top:8px;display:flex;flex-direction:column;gap:6px}
#sheet{display:none;position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:30}
#sheet .box{position:absolute;left:0;right:0;bottom:0;max-height:92%;overflow:auto;background:#fff;border-radius:26px 26px 0 0;padding:10px 16px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}
.grab{width:44px;height:5px;border-radius:9px;background:#CBD5E1;align-self:center}
.sh-h{display:flex;justify-content:space-between;align-items:center}.sh-h b{font-size:17px}
.x{border:0;background:#F1F5F9;border-radius:10px;width:36px;height:36px;font-size:22px;color:#334155}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;align-items:center;gap:10px;height:48px;border:0;border-radius:12px;background:#F8FAFC;font-weight:700;font-size:14px;padding:0 12px;text-align:right}
.dot{width:10px;height:10px;border-radius:99px;background:#94A3B8}
.dot.bl{background:#3B82F6}.dot.gr{background:#10B981}.dot.or{background:#F59E0B}.dot.rd{background:#DC2626}.dot.dg{background:#065F46}
#dlg{display:none;position:fixed;inset:0;background:rgba(15,23,42,.6);z-index:40;align-items:center;justify-content:center;padding:24px}
.dlgbox{background:#fff;border-radius:24px;padding:20px;width:100%;max-width:380px;display:flex;flex-direction:column;gap:12px;box-shadow:0 12px 40px rgba(0,0,0,.3)}
.pill{display:inline-block;margin:0}

.seg{display:flex;gap:4px;background:#E2E8F0;border-radius:14px;padding:4px;margin-bottom:10px}
.seg button{flex:1;border:0;background:none;border-radius:11px;height:38px;font-weight:700;font-size:13px;color:#334155}
.seg button.on{background:#fff;color:var(--teal);box-shadow:0 2px 0 #CBD5E1}
.chk{display:flex;align-items:center;gap:10px;height:44px;background:#F8FAFC;border-radius:12px;padding:0 12px;font-weight:700;font-size:14px}
.chk input{width:20px;height:20px;accent-color:var(--teal)}
.kv{display:flex;flex-direction:column;gap:2px;padding:6px 0;border-bottom:1px solid #F1F5F9}
.kv span{font-size:12px;color:var(--muted);font-weight:700}.kv div{font-size:14px;white-space:pre-wrap}
.tagd{background:#0F172A;color:#fff}

.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{background:var(--teal);color:#fff;padding:6px 4px;white-space:nowrap}
.tbl td{padding:6px 4px;border-bottom:1px solid #E2E8F0;text-align:center;white-space:nowrap}
.tbl tr.tot td{background:#F1F5F9;font-weight:800}
.hero{background:var(--dark);color:var(--cream);border-radius:22px;padding:16px}
.hero .big{font-size:32px;font-weight:800;color:#fff}
.mini{display:flex;gap:8px;margin-top:10px}.mini div{flex:1;background:rgba(255,255,255,.14);border-radius:12px;padding:8px;font-size:11px}.mini b{display:block;font-size:15px;color:#fff}
.tiles{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.tile{background:#fff;border:0;border-radius:16px;padding:10px;text-align:right;box-shadow:0 1px 3px rgba(15,23,42,.08)}
.tile b{display:block;font-size:24px;font-weight:800}
.al{border-radius:14px;padding:10px 12px;font-size:13px;font-weight:700}
.al.y{background:#FEF3C7;color:#92400E}.al.r{background:#FEE2E2;color:#991B1B}.al.g{background:#D1FAE5;color:#065F46}
#printArea{display:none}
@media print{body>*:not(#printArea){display:none!important}#printArea{display:block!important;padding:8px;direction:rtl}@page{size:A4 landscape;margin:10mm}}
</style>
</head>
<body>

<section id="login">
  <div class="logo">
    <div class="n">AURA</div><div class="l"></div>
    <div class="s">ATTRACT · UNDERSTAND · RECRUIT · ACHIEVE</div>
    <div class="t">RECRUITMENT &amp; TALENT SOLUTIONS</div>
  </div>
  <div class="form">
    <div><h1>تسجيل الدخول</h1><div class="sub">الحسابات بينشئها المدير فقط</div></div>
    <div id="err" class="err" style="display:none"></div>
    <div><label for="u">اسم المستخدم</label><div class="field"><input id="u" autocomplete="username" autocapitalize="none" spellcheck="false"></div></div>
    <div><label for="p">كلمة المرور</label><div class="field"><input id="p" type="password" autocomplete="current-password"><button type="button" class="eye" id="eye">إظهار</button></div></div>
    <button class="btn amber" id="go" style="height:52px;font-size:16px">دخول</button>
    <div style="text-align:center;font-size:11px;color:#6fa8a2">v6</div>
  </div>
</section>

<section id="app">
  <header>
    <div class="who"><b id="name"></b><span id="badges"></span></div>
    <div class="side"><div class="mark">AURA</div><button class="out" id="logout">تسجيل الخروج</button></div>
  </header>
  <main id="page"></main>
  <nav id="nav">
    <button data-t="today"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>النهارده</button>
    <button data-t="cands"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2 20c0-4 3-6 7-6s7 2 7 6"/></svg>المرشحين</button>
    <span class="gap"></span>
    <button data-t="offers"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5h6v2"/></svg>العروض</button>
    <button data-t="money"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="14" rx="3"/><path d="M16 13h2"/></svg>الفلوس</button>
  </nav>
  <button class="fab" id="fab" aria-label="إضافة">+</button>
</section>

<div id="menu"><div class="items" id="items"></div></div>
<div id="printArea"></div><div id="sheet"></div><div id="dlg"></div>
<div id="toast"></div>

<script>
function boot(){
// ---- إعدادات Supabase (المفتاح العام فقط - آمن بسبب قواعد RLS) ----
const SB_URL = 'https://msezwzpoafrnlkdosdwe.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1zZXp3enBvYWZybmxrZG9zZHdlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0OTkwMTYsImV4cCI6MjEwNzA3NTAxNn0.a4k5FccU_Y-I8rQC_k6Oprpviu5Q1Ds1xrs1EFpodMs';
const sb = supabase.createClient(SB_URL, SB_KEY);

const $ = id => document.getElementById(id);
const ROLE = { owner: 'مدير', senior: 'سينيور', recruiter: 'ريكروتر' };
const TABS = { today: 'النهارده', cands: 'المرشحين', offers: 'العروض', money: 'الفلوس' };
let profile = null, idleTimer = null, uid = null;

function showErr(msg){ const e=$('err'); e.textContent=msg; e.style.display=msg?'block':'none'; }
function toast(msg){ const t=$('toast'); t.textContent=msg; t.style.display='block'; setTimeout(()=>t.style.display='none',2200); }

// ---- الدخول ----
$('eye').onclick = () => { const p=$('p'); const s=p.type==='password'; p.type=s?'text':'password'; $('eye').textContent=s?'إخفاء':'إظهار'; };
$('go').onclick = login;
['u','p'].forEach(id => $(id).addEventListener('keydown', e => { if(e.key==='Enter') login(); }));

async function login(){
  showErr('');
  let u = $('u').value.trim().toLowerCase(); const p = $('p').value;
  if(!u || !p){ showErr('اكتب اسم المستخدم وكلمة المرور'); return; }
  if(!u.includes('@')) u += '@aura.local';
  $('go').disabled = true; $('go').textContent = 'جاري الدخول...';
  const { error } = await sb.auth.signInWithPassword({ email: u, password: p });
  $('go').disabled = false; $('go').textContent = 'دخول';
  if(error){ showErr('اسم المستخدم أو كلمة المرور غير صحيحة'); return; }
  await start();
}

// ---- بعد الدخول: قراءة الدور من قاعدة البيانات فقط ----
async function start(){
  const { data: { user } } = await sb.auth.getUser();
  if(!user){ showLogin(); return; }
  const { data, error } = await sb.from('profiles').select('full_name, role, is_tl, active').eq('id', user.id).maybeSingle();
  if(error || !data || !data.active){
    await sb.auth.signOut(); showLogin();
    showErr('الحساب غير مفعّل، تواصل مع المدير'); return;
  }
  profile = data; uid = user.id; showApp(); resetIdle();
}

function showLogin(){ $('app').style.display='none'; $('login').style.display='flex'; $('p').value=''; profile=null; clearTimeout(idleTimer); }

function showApp(){
  $('login').style.display='none'; $('app').style.display='flex';
  $('name').textContent = profile.full_name || '';
  const b = $('badges'); b.innerHTML='';
  const add = t => { const s=document.createElement('span'); s.className='badge'; s.textContent=t; b.appendChild(s); };
  add(ROLE[profile.role] || profile.role);
  if(profile.is_tl) add('تيم ليدر');
  go('today');
}

function go(t){
  document.querySelectorAll('#nav button').forEach(x => x.classList.toggle('on', x.dataset.t===t));
  if(t==='cands'){ renderCands(); return; }
  if(t==='offers'){ renderOffers(); return; }
  if(t==='today'){ renderToday(); return; }
  if(t==='money'){ renderMoney(); return; }
  $('page').innerHTML = '<h2></h2><div class="empty">الصفحة دي هتتبني في مرحلة جاية.</div>';
  $('page').querySelector('h2').textContent = TABS[t];
}
document.querySelectorAll('#nav button').forEach(x => x.onclick = () => go(x.dataset.t));

// ---- قايمة + ----
$('fab').onclick = () => {
  const items = [['مرشح جديد', false]];
  if(profile.role==='owner') items.push(['عرض جديد',true],['شركة جديدة',true],['وكالة جديدة',true]);
  const box = $('items'); box.innerHTML='';
  items.forEach(([label, ownerOnly]) => {
    const b = document.createElement('button'); b.className='it';
    const s = document.createElement('span'); s.textContent = label; b.appendChild(s);
    if(ownerOnly){ const t=document.createElement('span'); t.className='tag'; t.textContent='المدير'; b.appendChild(t); }
    b.onclick = () => { $('menu').style.display='none'; if(label==='مرشح جديد') candForm(null); else if(label==='عرض جديد') offerForm(null); else if(label==='شركة جديدة') companyForm(null); else if(label==='وكالة جديدة') agencyForm(null); };
    box.appendChild(b);
  });
  $('menu').style.display='block';
};
$('menu').onclick = e => { if(e.target.id==='menu') $('menu').style.display='none'; };


// ================= المرحلة 2: المرشحين وتغيير الحالة =================
function h(tag, attrs, ...kids){
  const e=document.createElement(tag); let val;
  for(const k in (attrs||{})){ const v=attrs[k];
    if(k==='class') e.className=v;
    else if(k==='style') e.style.cssText=v;
    else if(k==='value') val=v;
    else if(k.startsWith('on')) e[k]=v;
    else if(v!==false && v!=null) e.setAttribute(k, v===true?'':v);
  }
  kids.flat(2).forEach(c=>{ if(c==null||c===false) return; e.appendChild(typeof c==='object'?c:document.createTextNode(String(c))); });
  if(val!==undefined) e.value=val;
  return e;
}
const sheet=$('sheet');
function openSheet(title, content){
  sheet.innerHTML='';
  sheet.appendChild(h('div',{class:'box'}, h('div',{class:'grab'}), h('div',{class:'sh-h'}, h('b',null,title), h('button',{class:'x',onclick:closeSheet},'×')), content));
  sheet.style.display='block';
}
function closeSheet(){ sheet.style.display='none'; sheet.innerHTML=''; }
sheet.onclick=e=>{ if(e.target===sheet) closeSheet(); };

function confirmBox(title,text,extra,label){
  return new Promise(res=>{
    const d=$('dlg'); d.innerHTML='';
    const close=v=>{ d.style.display='none'; d.innerHTML=''; res(v); };
    d.appendChild(h('div',{class:'dlgbox'},
      h('b',{style:'font-size:18px'},title),
      h('div',{class:'m',style:'font-size:14px;line-height:1.7'},text),
      extra||null,
      h('div',{class:'r2'}, h('button',{class:'btn b2',style:'flex:1',onclick:()=>close(false)},'إلغاء'),
                           h('button',{class:'btn',style:'flex:1.4',onclick:()=>close(true)},label||'تأكيد'))));
    d.style.display='flex';
  });
}
async function copy(text){
  try{ await navigator.clipboard.writeText(text); }
  catch(e){ const t=h('textarea',{style:'position:fixed;opacity:0'}); t.value=text; document.body.appendChild(t); t.select(); try{document.execCommand('copy');}catch(_){} t.remove(); }
  toast('تم النسخ ✓');
}
const today=()=>new Date().toISOString().slice(0,10);
function normPhone(p){
  let d=(p||'').replace(/\D/g,'');
  if(d.startsWith('0020')) d=d.slice(4);
  if(d.startsWith('20') && d.length===12) d='0'+d.slice(2);
  if(d.length===10 && d.startsWith('1')) d='0'+d;
  return d;
}
const waNum=p=> p.startsWith('0') ? '2'+p : p;

const GRAD={grad:'خريج',undergrad:'طالب',dropout:'Dropout',gap:'Gap year'};
const LV=[['','—'],[2,'A2'],[3,'B1'],[4,'B2'],[5,'B2+'],[6,'C1'],[7,'C2']];
const rankLabel=r=>{ const x=LV.find(v=>String(v[0])===String(r)); return x&&x[0]!==''?x[1]:''; };

const ST={
  offered:['تم عرض الأوفر','g'], accepted_offer:['وافق على الأوفر','bl'], declined_offer:['لم يوافق على الأوفر','rd'],
  voice_sent:['تم إرسال الفويس نوت','bl'], voice_accepted:['تم قبول الفويس نوت - جاهز للإنترفيو','gr'], voice_rejected:['تم رفض الفويس نوت','rd'],
  interview_set:['تم تحديد معاد الإنترفيو','or'], no_show:['لم يحضر الإنترفيو','rd'], interviewed:['تم الإنترفيو - بانتظار التعيين','or'],
  rejected_after_interview:['مرفوض بعد الإنترفيو','rd'], hired:['تم التعيين - بانتظار العمولة','gr'], retention_failed:['فشل الاحتفاظ','rd'],
  commission_received:['تم استلام العمولة - مغلق','dg']
};
const NEXT={
  offered:['accepted_offer','voice_sent','declined_offer'], accepted_offer:['voice_sent','declined_offer'],
  voice_sent:['voice_accepted','voice_rejected'], voice_accepted:['interview_set'], interview_set:['interviewed','no_show'],
  no_show:['interview_set'], interviewed:['hired','rejected_after_interview'], hired:['retention_failed','commission_received']
};
const TERMINAL=['declined_offer','voice_rejected','no_show','rejected_after_interview','retention_failed','commission_received'];
const NEEDS_REASON=['declined_offer','voice_rejected','no_show','rejected_after_interview','retention_failed'];
function allowed(st){
  return (NEXT[st]||[]).filter(s=>{
    if((s==='hired'||s==='retention_failed') && !['owner','senior'].includes(profile.role)) return false;
    if(s==='commission_received' && profile.role!=='owner') return false;
    return true;
  });
}

let CANDS=[], FILTER={q:'',status:'',archived:false};
async function loadCands(){
  const { data, error } = await sb.from('candidates')
    .select('*, applications(id,status,voice_status,archived,offer_id,interview_at,offers(title,candidate_message,interview_info,companies(name)))')
    .order('created_at',{ascending:false});
  if(error){ toast('تعذر تحميل المرشحين'); return []; }
  return data||[];
}

async function renderCands(){
  const page=$('page'); page.innerHTML='';
  page.appendChild(h('h2',null,'المرشحين'));
  const q=h('input',{class:'in',placeholder:'بحث بالاسم أو الرقم',value:FILTER.q,oninput:e=>{FILTER.q=e.target.value;paint();}});
  const sel=h('select',{class:'in',onchange:e=>{FILTER.status=e.target.value;paint();}},
    h('option',{value:''},'كل الحالات'), Object.keys(ST).map(k=>h('option',{value:k},ST[k][0])));
  sel.value=FILTER.status;
  const arch=h('button',{class:'ch'+(FILTER.archived?' on':''),onclick:()=>{FILTER.archived=!FILTER.archived;renderCands();}},'الأرشيف');
  const count=h('div',{class:'m'});
  const list=h('div',{class:'list'});
  page.append(q, h('div',{class:'r2',style:'margin-top:8px'},sel,arch), count, list);
  list.appendChild(h('div',{class:'m'},'جاري التحميل...'));
  CANDS=await loadCands(); paint();

  function paint(){
    list.innerHTML='';
    const qq=FILTER.q.trim().toLowerCase(), qd=qq.replace(/\D/g,'');
    const rows=CANDS.filter(c=>{
      const apps=c.applications||[];
      const isArch=c.archived || (apps.length>0 && apps.every(a=>a.archived));
      if(isArch!==FILTER.archived) return false;
      if(FILTER.status && !apps.some(a=>a.status===FILTER.status)) return false;
      if(qq && !(c.full_name.toLowerCase().includes(qq) || (qd && c.phone.includes(qd)))) return false;
      return true;
    });
    count.textContent=rows.length+' مرشح';
    if(!rows.length){ list.appendChild(h('div',{class:'empty'},'مفيش مرشحين هنا.')); return; }
    rows.forEach(c=>list.appendChild(candCard(c)));
  }
}

function candCard(c){
  const apps=(c.applications||[]).filter(a=>FILTER.archived||!a.archived);
  const fresh=apps.find(a=>a.status==='offered');
  const msg=fresh&&fresh.offers?fresh.offers.candidate_message:'';
  const wa='https://wa.me/'+waNum(c.phone)+(msg?'?text='+encodeURIComponent(msg):'');
  const i1=[c.age?c.age+' سنة':null,GRAD[c.grad_status],c.lang1?c.lang1+' '+rankLabel(c.lang1_rank):null,c.city].filter(Boolean).join(' - ');
  const i2=['خبرة: '+(c.experience_months?c.experience_months+' شهر':'لا يوجد')+(c.experience_type?' '+c.experience_type:''),c.source?'المصدر: '+c.source:null].filter(Boolean).join(' - ');
  return h('div',{class:'card'},
    h('div',{class:'rowb'},h('b',{style:'font-size:16px'},c.full_name),h('button',{class:'lnk',onclick:()=>candForm(c)},'تعديل')),
    h('div',{class:'m'},i1), h('div',{class:'m'},i2),
    apps.map(a=>appRow(a,c)),
    h('div',{class:'r2'},
      h('a',{class:'btn b2 sm',href:'tel:'+c.phone},'اتصال'),
      h('a',{class:'btn b2 sm',href:wa,target:'_blank',rel:'noopener'},'واتساب'),
      h('button',{class:'btn sm',onclick:()=>offerSheet(c)},'اعرض أوفر')));
}

function appRow(a,c){
  const o=a.offers||{}, co=(o.companies&&o.companies.name)||'', st=ST[a.status]||[a.status,'g'];
  const kids=[h('div',{class:'rowb'},h('b',{style:'font-size:14px'},co+(o.title?' - '+o.title:'')),h('span',{class:'t '+st[1]},st[0]))];
  if(a.interview_at) kids.push(h('div',{class:'m'},'الإنترفيو: '+new Date(a.interview_at).toLocaleString('ar-EG',{dateStyle:'medium',timeStyle:'short'})));
  const btns=[h('button',{class:'btn sm',onclick:()=>statusSheet(a,c)},'تغيير الحالة ▾')];
  if(['voice_accepted','interview_set'].includes(a.status) && o.interview_info)
    btns.push(h('button',{class:'btn amber sm',onclick:()=>copy(o.interview_info)},'نسخ معلومات الإنترفيو والتقديم'));
  kids.push(h('div',{class:'r2'},btns));
  return h('div',{class:'app'},kids);
}

// ---- تغيير الحالة (قائمة ثم تأكيد) ----
function statusSheet(a,c){
  const opts=allowed(a.status);
  const list=h('div',{class:'opts'});
  if(!opts.length) list.appendChild(h('div',{class:'m'},'مفيش حالات متاحة بعد الحالة دي لصلاحيتك.'));
  opts.forEach(s=>list.appendChild(h('button',{class:'opt',onclick:()=>changeStatus(a,c,s)},h('span',{class:'dot '+ST[s][1]}),ST[s][0])));
  openSheet('تغيير حالة '+c.full_name,list);
}
async function changeStatus(a,c,to){
  const extra=h('div',{style:'display:flex;flex-direction:column;gap:6px'});
  let dt,dd,rs;
  if(to==='interview_set'){ dt=h('input',{type:'datetime-local',class:'in'}); extra.append(h('label',{class:'lb'},'معاد الإنترفيو'),dt); }
  if(to==='hired'){ dd=h('input',{type:'date',class:'in',value:today()}); extra.append(h('label',{class:'lb'},'تاريخ بداية الشغل'),dd); }
  if(NEEDS_REASON.includes(to)){ rs=h('textarea',{class:'in',rows:2,placeholder:'السبب (اختياري)'}); extra.append(rs); }
  const ok=await confirmBox('هل أنت متأكد من التغيير؟','سيتم تغيير حالة '+c.full_name+' من «'+ST[a.status][0]+'» إلى «'+ST[to][0]+'».',extra,'تأكيد التغيير');
  if(!ok) return;
  if(dt && !dt.value){ toast('حدد معاد الإنترفيو وأعد المحاولة'); return; }
  const upd={status:to, archived:TERMINAL.includes(to)};
  if(dt) upd.interview_at=new Date(dt.value).toISOString();
  if(dd){ upd.start_date=dd.value; upd.hired_at=dd.value; }
  if(rs && rs.value.trim()) upd.reject_reason=rs.value.trim();
  const { error } = await sb.from('applications').update(upd).eq('id',a.id);
  if(error){ toast(error.message||'تعذر التغيير'); return; }
  closeSheet(); toast('تم تغيير الحالة'); renderCands();
}

// ---- مطابقة وعرض أوفر ----
function matches(c,o){
  if(o.min_age!=null && c.age!=null && c.age<o.min_age) return false;
  if(o.max_age!=null && c.age!=null && c.age>o.max_age) return false;
  if(o.grad_allowed && o.grad_allowed.length && c.grad_status && !o.grad_allowed.includes(c.grad_status)) return false;
  if(o.lang1_min_rank!=null){
    const eq=(a,b)=>a&&b&&a.trim().toLowerCase()===b.trim().toLowerCase();
    const ok=(eq(c.lang1,o.lang1)&&(c.lang1_rank||0)>=o.lang1_min_rank)||(eq(c.lang2,o.lang1)&&(c.lang2_rank||0)>=o.lang1_min_rank);
    if(!ok) return false;
  }
  if((c.experience_months||0)<(o.min_experience_months||0)) return false;
  if(o.gender && c.gender && o.gender!==c.gender) return false;
  return true;
}
async function offerSheet(c){
  openSheet('أنسب عروض لـ '+c.full_name,h('div',{class:'m'},'جاري التحميل...'));
  const { data, error } = await sb.from('offers')
    .select('id,title,status,location,work_mode,min_age,max_age,lang1,lang1_min_rank,grad_allowed,min_experience_months,gender,salary_text,candidate_message,company_id,companies(name,status,recruiter_amount,senior_amount,retention_days)')
    .eq('status','active');
  if(error){ openSheet('أنسب عروض',h('div',{class:'err'},'تعذر تحميل العروض')); return; }
  const my=o=> profile.role==='senior' ? o.companies.senior_amount : o.companies.recruiter_amount;
  const list=(data||[]).filter(o=>o.companies && o.companies.status==='active' && matches(c,o)).sort((x,y)=>my(y)-my(x));
  const box=h('div',{class:'opts'});
  if(!list.length) box.appendChild(h('div',{class:'empty'},'مفيش عروض مناسبة لبيانات المرشح دلوقتي. جرّب تعدّل بياناته.'));
  list.forEach(o=>box.appendChild(h('div',{class:'card',style:'background:#F8FAFC;box-shadow:none'},
    h('div',{class:'rowb'},h('b',null,o.companies.name+' - '+o.title),h('span',{class:'t gr'},'مناسب')),
    h('div',{class:'m'},[o.location,o.work_mode,o.salary_text].filter(Boolean).join(' - ')),
    h('div',{class:'r2',style:'flex-wrap:wrap'},h('span',{class:'t gr'},'عمولتك '+my(o)),h('span',{class:'t g'},'Retention '+o.companies.retention_days+' يوم')),
    h('div',{class:'r2'},
      h('button',{class:'btn b2 sm',onclick:()=>copy(o.candidate_message||'')},'نسخ العرض'),
      h('button',{class:'btn sm',onclick:()=>applyTo(c,o)},'اعرضه على المرشح')))));
  openSheet('أنسب عروض لـ '+c.full_name,box);
}
async function applyTo(c,o){
  if((c.applications||[]).some(a=>a.offer_id===o.id && !a.archived)){ toast('المرشح معروض عليه العرض ده بالفعل'); return; }
  const { data:dup } = await sb.rpc('check_duplicate',{p_phone:c.phone,p_company:o.company_id});
  if(dup){ toast('المرشح متقدم لنفس الشركة خلال فترة الانتظار'); return; }
  const owner = profile.role==='owner' ? c.owner_id : uid;
  const { error } = await sb.from('applications').insert({candidate_id:c.id,offer_id:o.id,owner_id:owner});
  if(error){ toast(error.message||'تعذر العرض'); return; }
  closeSheet(); toast('تم تسجيل العرض ✓'); renderCands();
}

const CST={active:['نشط','gr'],hold:['متوقف (Hold)','or'],cancelled:['ملغي','rd']};
const OST={active:['نشط','gr'],hold:['متوقف (Hold)','or'],closed:['مغلق','rd']};
const toInt=v=>v===''||v==null?null:parseInt(v,10);
const toNum=v=>v===''||v==null?null:Number(v);
const isOwner=()=>profile.role==='owner';
let OSEG='offers', OFILTER='all';
const one=x=>Array.isArray(x)?x[0]:x;

function chipsRow(opts,cur,pick){
  return h('div',{class:'r2',style:'flex-wrap:wrap;margin-bottom:8px'},opts.map(([k,l])=>h('button',{class:'ch'+(cur===k?' on':''),onclick:()=>pick(k)},l)));

async function renderOffers(){

// ---- العروض ----
async function paintOffers(body){
  const { data, error } = await sb.from('offers').select('*, companies(name,status,hide_name_in_copy)').order('created_at',{ascending:false});
  body.innerHTML='';
  if(error){ body.appendChild(h('div',{class:'err'},'تعذر تحميل العروض')); return; }
  body.appendChild(chipsRow([['all','الكل'],['active','نشط'],['hold','متوقف'],['closed','مغلق']],OFILTER,k=>{OFILTER=k;renderOffers();}));
  const rows=(data||[]).filter(o=>OFILTER==='all'||o.status===OFILTER);
  if(!rows.length){ body.appendChild(h('div',{class:'empty'},'مفيش عروض هنا.')); return; }
  rows.forEach(o=>{ const st=OST[o.status]||[o.status,'g'];
    body.appendChild(h('div',{class:'card'},
      h('div',{class:'rowb'},h('b',null,(o.companies?o.companies.name:'')+' - '+o.title),h('span',{class:'t '+st[1]},st[0])),
      h('div',{class:'m'},[o.location,o.work_mode,o.salary_text].filter(Boolean).join(' - ')),
      h('div',{class:'r2'},
        h('button',{class:'btn b2 sm',onclick:()=>copy(o.candidate_message||'')},'نسخ العرض'),
        h('button',{class:'btn sm',onclick:()=>offerDetails(o)},'فتح العرض'))));
  });
}

const fmt=n=>Number(n||0).toLocaleString('en-US');
const daysTo=d=>Math.round((new Date(d+'T00:00:00')-new Date(today()+'T00:00:00'))/86400000);
const KIND={recruiter:'ريكروتر',senior:'سينيور',tl:'تيم ليدر'};
const CS={expected:['متوقعة','or'],ready:['جاهزة','gr'],paid:['مدفوعة','dg'],lost:['ضايعة','rd']};
function cstate(c){
  if(c.status==='paid') return 'paid'; if(c.status==='lost') return 'lost';
  return (c.expected_date && c.expected_date<=today()) ? 'ready' : 'expected';
}
function cycleLabel(d){
  if(!d) return '';
  const x=new Date(d+'T00:00:00'), day=x.getDate(); let m=x.getMonth(), y=x.getFullYear(), lab;
  if(day<=3) lab='1-3'; else if(day<=17) lab='15-17'; else { lab='1-3'; m++; if(m>11){m=0;y++;} }
  return 'دورة '+lab+' '+new Date(y,m,1).toLocaleDateString('ar-EG',{month:'long'});
}

  const priv={};
  if(isOwner()){ const p=await sb.from('commission_private').select('*'); (p.data||[]).forEach(x=>priv[x.application_id]=x); }
  return { rows:r.data||[], priv, error:r.error };
}
function sums(rows){ const o={expected:0,ready:0,paid:0,lost:0}; rows.forEach(c=>{o[cstate(c)]+=Number(c.amount||0);}); return o; }
function ownerNet(rows,priv){
  const by={}; rows.forEach(c=>{ (by[c.application_id]=by[c.application_id]||[]).push(c); });
  let agency=0,team=0,net=0,netReady=0;
  Object.keys(by).forEach(id=>{ const rs=by[id]; if(rs.every(c=>c.status==='lost')) return; const p=priv[id]; if(!p) return;
    agency+=Number(p.agency_amount); net+=Number(p.net_amount); team+=Number(p.agency_amount)-Number(p.net_amount);
    if(rs.some(c=>cstate(c)==='ready')) netReady+=Number(p.net_amount); });
  return {agency,team,net,netReady};
}

// ---- الفلوس ----
let MF='expected';
async function renderMoney(){
  const page=$('page'); page.innerHTML=''; page.appendChild(h('h2',null,'الفلوس'));
  const body=h('div',{class:'list',style:'margin-top:0'}); page.appendChild(body);
  body.appendChild(h('div',{class:'m'},'جاري التحميل...'));
  const mn=await loadMoney(); body.innerHTML='';
  if(mn.error){ body.appendChild(h('div',{class:'err'},'تعذر تحميل العمولات')); return; }
  const rows=mn.rows, mine=rows.filter(c=>c.earner_id===uid);
  if(isOwner()){ const n=ownerNet(rows,mn.priv);
    body.appendChild(h('div',{class:'hero'},h('div',null,'صافي ربحك'),h('div',{class:'big'},fmt(n.net)+' ج.م'),
      h('div',{class:'mini'},h('div',null,'إجمالي الوكالة',h('b',null,fmt(n.agency))),h('div',null,'مستحقات الفريق',h('b',null,fmt(n.team))),h('div',null,'جاهز للصرف',h('b',null,fmt(n.netReady))))));
    body.appendChild(h('button',{class:'btn amber',onclick:openReport},'تقرير الفريق (PDF)'));
  } else {
    const sm=sums(mine);
    body.appendChild(h('div',{class:'hero'},h('div',null,'عمولتك'),h('div',{class:'big'},fmt(sm.expected+sm.ready+sm.paid)+' ج.م'),
      h('div',{class:'mini'},h('div',null,'متوقعة',h('b',null,fmt(sm.expected))),h('div',null,'جاهزة',h('b',null,fmt(sm.ready))),h('div',null,'مدفوعة',h('b',null,fmt(sm.paid))))));
    if(profile.role==='senior'){ const others=sums(rows.filter(c=>c.earner_id!==uid));
      body.appendChild(h('div',{class:'card'},h('b',{style:'font-size:14px'},'مستحقات فريقك'),h('div',{class:'r2',style:'flex-wrap:wrap'},
        h('span',{class:'t or'},'متوقعة '+fmt(others.expected)),h('span',{class:'t gr'},'جاهزة '+fmt(others.ready)),h('span',{class:'t dg'},'مدفوعة '+fmt(others.paid))))); }
  }
  body.appendChild(chipsRow([['expected','متوقعة'],['ready','جاهزة'],['paid','مدفوعة'],['lost','ضايعة']],MF,k=>{MF=k;renderMoney();}));
  const by={}; rows.forEach(c=>{ (by[c.application_id]=by[c.application_id]||[]).push(c); });
  const groups=Object.values(by).filter(rs=>rs.some(c=>cstate(c)===MF));
  if(!groups.length){ body.appendChild(h('div',{class:'empty'},'مفيش عمولات في الحالة دي.')); return; }
  groups.forEach(rs=>{ const a=rs[0].applications||{}, cn=(a.candidates&&a.candidates.full_name)||'', o=a.offers||{}, co=(o.companies&&o.companies.name)||'', p=mn.priv[rs[0].application_id];
    const kids=[h('div',{class:'rowb'},h('b',null,cn),h('span',{class:'t g'},co)),
      h('div',{class:'m'},'تنتهي فترة الـ Retention: '+(a.retention_end||'-')+' - '+cycleLabel(a.retention_end))];
    rs.forEach(c=>{ const st=CS[cstate(c)];
      kids.push(h('div',{class:'rowb',style:'border-top:1px dashed #E2E8F0;padding-top:6px'},
        h('div',null,h('div',{style:'font-size:13px;font-weight:700'},((c.earner&&c.earner.full_name)||'')+' ('+(KIND[c.kind]||c.kind)+')'),h('div',{class:'m'},fmt(c.amount)+' ج.م')),
        h('div',{class:'r2'},h('span',{class:'t '+st[1]},st[0]),
          (isOwner()&&cstate(c)==='ready')?h('button',{class:'btn sm',style:'flex:none;width:auto',onclick:()=>payRow(c)},'تم الدفع'):null)));
    });
    if(isOwner()&&p) kids.push(h('div',{class:'m'},'عمولة الوكالة '+fmt(p.agency_amount)+' - صافي ليك '+fmt(p.net_amount)));

    body.appendChild(h('div',{class:'card'},kids));
  });
}
async function payRow(c){
  if(!await confirmBox('تأكيد الدفع؟','تأكيد دفع '+fmt(c.amount)+' ج.م إلى '+((c.earner&&c.earner.full_name)||'')+'.',null,'تأكيد الدفع')) return;
  const {error}=await sb.from('commissions').update({status:'paid',paid_at:today(),paid_amount:c.amount}).eq('id',c.id);
  if(error){ toast(error.message); return; } toast('تم تسجيل الدفع ✓'); renderMoney();
}
async function agencyPaid(a){
  if(!await confirmBox('تأكيد الاستلام؟','تأكيد استلام عمولة '+((a.candidates&&a.candidates.full_name)||'')+' من الوكالة. الحالة هتتحول إلى «تم استلام العمولة - مغلق» ويتأرشف.',null,'تأكيد')) return;
  const {error}=await sb.from('applications').update({status:'commission_received',archived:true}).eq('id',a.id);
  if(error){ toast(error.message); return; } toast('تم ✓'); renderMoney();
}

// ---- تقرير الفريق (المدير) ----
function openReport(){
  if(!isOwner()) return;
  const m=h('input',{type:'month',class:'in',value:today().slice(0,7)});
  openSheet('تقرير الفريق',h('div',{style:'display:flex;flex-direction:column;gap:10px'},fld('الشهر',m),
    h('div',{class:'r2'},h('button',{class:'btn b2 sm',onclick:()=>runReport(null,null)},'كل الفترة'),
      h('button',{class:'btn sm',onclick:()=>{ const [y,mo]=m.value.split('-').map(Number); runReport(m.value+'-01',m.value+'-'+String(new Date(y,mo,0).getDate()).padStart(2,'0')); }},'عرض التقرير'))));
}
function reportEl(data,label){
  const groups={}; data.forEach(r=>{ (groups[r.tl_name]=groups[r.tl_name]||[]).push(r); });
  const cols=['الاسم','الموبايل','إجمالي المرشحين','قيد المعالجة','مرفوض','تم التعيين','مكتمل Retention','المستحق (ج.م)'];
  const sum=(rs,k)=>rs.reduce((x,r)=>x+Number(r[k]||0),0);
  const wrap=h('div',null,h('b',{style:'font-size:18px'},'تقرير الفريق - AURA'),h('div',{class:'m'},label+' - تاريخ التصدير '+today()));
  const all=[];
  Object.keys(groups).forEach(tl=>{ const rs=groups[tl]; all.push(...rs);
    const t=h('table',{class:'tbl'},h('tr',null,cols.map(c=>h('th',null,c))),
      rs.map(r=>h('tr',null,[r.member_name,r.member_phone||'-',r.total_candidates,r.processing,r.rejected,r.hired,r.retention_done,fmt(r.due_amount)].map(v=>h('td',null,String(v))))),
      h('tr',{class:'tot'},['إجمالي '+tl,'',sum(rs,'total_candidates'),sum(rs,'processing'),sum(rs,'rejected'),sum(rs,'hired'),sum(rs,'retention_done'),fmt(sum(rs,'due_amount'))].map(v=>h('td',null,String(v)))));
    wrap.append(h('div',{style:'margin-top:12px'},h('b',null,'فريق: '+tl),h('div',{style:'overflow-x:auto'},t)));
  });
  wrap.append(h('div',{class:'card',style:'margin-top:12px'},h('b',null,'إجمالي كل الفرق'),
    h('div',{class:'r2',style:'flex-wrap:wrap'},h('span',{class:'t g'},'مرشحين '+sum(all,'total_candidates')),h('span',{class:'t or'},'قيد المعالجة '+sum(all,'processing')),
      h('span',{class:'t rd'},'مرفوض '+sum(all,'rejected')),h('span',{class:'t gr'},'تم التعيين '+sum(all,'hired')),h('span',{class:'t dg'},'المستحق '+fmt(sum(all,'due_amount'))))));
  wrap.append(h('div',{class:'m',style:'margin-top:8px'},'المبالغ حسب نظام التطبيق: العمولات المتوقعة والجاهزة بعد انتهاء فترة الـ Retention.'));
  return wrap;
}
async function runReport(from,to){
  openSheet('تقرير الفريق',h('div',{class:'m'},'جاري التحميل...'));
  const {data,error}=await sb.rpc('team_report',{p_from:from,p_to:to});
  if(error){ openSheet('تقرير الفريق',h('div',{class:'err'},error.message)); return; }
  const label=from?('من '+from+' إلى '+to):'كل الفترة';
  if(!(data||[]).length){ openSheet('تقرير الفريق',h('div',{class:'empty'},'مفيش بيانات.')); return; }
  const el=reportEl(data,label);
  openSheet('تقرير الفريق',h('div',null,el,h('button',{class:'btn amber',style:'width:100%;margin-top:12px',onclick:()=>{
    const pa=$('printArea'); pa.innerHTML=''; pa.appendChild(reportEl(data,label)); window.print(); }},'تصدير PDF (طباعة ثم حفظ PDF)')));
}

(function(){
  var urls=['https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js','https://unpkg.com/@supabase/supabase-js@2.45.4/dist/umd/supabase.js'];
  var btn=document.getElementById('go'), er=document.getElementById('err');
  btn.disabled=true; btn.textContent='جاري التحميل...';
  function next(i){
    if(i>=urls.length){ er.textContent='تعذر تحميل مكتبة الاتصال. جرّب شبكة أو متصفح تاني.'; er.style.display='block'; btn.textContent='دخول'; return; }
    var sc=document.createElement('script'); sc.src=urls[i]; var done=false;
    var t=setTimeout(function(){ if(!done){ done=true; sc.remove(); next(i+1); } },8000);
    sc.onload=function(){ if(done) return; done=true; clearTimeout(t); btn.disabled=false; btn.textContent='دخول'; boot(); };
    sc.onerror=function(){ if(done) return; done=true; clearTimeout(t); next(i+1); };
    document.head.appendChild(sc);
  }
  next(0);
})();
